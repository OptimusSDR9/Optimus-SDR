<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimus AI SDR | Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="flex min-h-screen items-center justify-center px-4">
        <div class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900/80 p-8 shadow-2xl">
            <div class="mb-6 text-center">
                <p class="text-sm font-semibold uppercase tracking-[0.3em] text-cyan-400">Optimus AI SDR</p>
                <h1 class="mt-2 text-2xl font-semibold">Create your account</h1>
                <p class="mt-2 text-sm text-slate-400">Start orchestrating outbound prospecting in minutes.</p>
            </div>
            {% if error %}
            <div class="mb-4 rounded-lg border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-sm text-rose-300">
                {{ error }}
            </div>
            {% endif %}
            <form method="post" action="/auth/register" class="space-y-4">
                <div>
                    <label class="mb-1 block text-sm text-slate-300" for="full_name">Full Name</label>
                    <input id="full_name" name="full_name" type="text" required class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100 outline-none ring-0 focus:border-cyan-500" />
                </div>
                <div>
                    <label class="mb-1 block text-sm text-slate-300" for="email">Email</label>
                    <input id="email" name="email" type="email" required class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100 outline-none ring-0 focus:border-cyan-500" />
                </div>
                <div>
                    <label class="mb-1 block text-sm text-slate-300" for="password">Password</label>
                    <input id="password" name="password" type="password" required class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100 outline-none ring-0 focus:border-cyan-500" />
                </div>
                <button type="submit" class="w-full rounded-lg bg-cyan-500 px-4 py-2.5 font-medium text-slate-950 transition hover:bg-cyan-400">Create Account</button>
            </form>
            <p class="mt-6 text-center text-sm text-slate-400">
                Already have an account?
                <a href="/auth/login" class="font-medium text-cyan-400 hover:text-cyan-300">Sign in</a>
            </p>
        </div>
    </div>
</body>
</html>
